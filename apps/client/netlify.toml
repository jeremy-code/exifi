[build]
base = "apps/client"
publish = "dist/client"
command = "pnpm --workspace-root exec turbo run build --filter=@exifi/client..."
# When using pnpm in the ignore command, it simply responds with "pnpm: command not found"
ignore = "corepack pnpm --workspace-root exec turbo query affected --packages @exifi/client --base \"$CACHED_COMMIT_REF\" --exit-code"

[build.processing.html]
pretty_urls = true

[[plugins]]
package = "netlify-plugin-emsdk"
[plugins.inputs]
version = "6.0.10"

# Vite emits fingerprinted files under /assets, so they can be cached until the
# filename changes on a later build.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.json"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# https://docs.netlify.com/manage/routing/redirects/redirect-options/#custom-404-page-handling
[[redirects]]
from = "/*"
to = "/404/index.html"
status = 404
