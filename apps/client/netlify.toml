[build]
publish = "apps/client/dist/client"
command = "turbo run build"

[build.processing.html]
pretty_urls = true

[[plugins]]
package = "netlify-plugin-emsdk"

# Vite emits fingerprinted files under /assets, so they can be cached until the
# filename changes on a later build.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
