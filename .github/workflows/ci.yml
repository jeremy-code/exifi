name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

permissions: {} # Each job defines its own permissions explicitly

jobs:
  build:
    name: Build
    permissions:
      contents: read # Access to check out code and install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Cache Turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: true

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.8

      - name: Run codegen scripts
        run: pnpm run codegen

      - name: Lint code with Oxlint
        run: pnpm run lint

      - name: Check code formatting with Oxfmt
        run: pnpm run format:check

      - name: Get Playwright version
        id: playwright-version
        run: |
          playwright_version=$(
            pnpm why playwright --json \
              | jq -r "first | .version"
          )
          echo "PLAYWRIGHT_VERSION=${playwright_version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: |
            ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm --filter @exifi/client exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
